name: Synchronize plugins template

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'tools/schemas/**'
      - 'tools/sync_plugins_template.py'
  workflow_dispatch:

concurrency:
  group: sync-plugins-template
  cancel-in-progress: true

jobs:
  sync-template:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plugins repository
        uses: actions/checkout@v4
        with:
          path: unnamed_tracking_app_plugins

      - name: Checkout plugins-template repository
        uses: actions/checkout@v4
        with:
          repository: obsoletelabs/plugins-template
          path: plugins-template
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plugins-template/requirements-dev.txt

      - name: Run synchronization and tests
        run: |
          python unnamed_tracking_app_plugins/tools/sync_plugins_template.py --template-root plugins-template

      - name: Create Pull Request or commit if drifted
        working-directory: plugins-template
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "obsoletelabs-ai"
            git config user.email "github-ai@obsoletelabs.net"
            SHA=$(git -C ../unnamed_tracking_app_plugins rev-parse --short HEAD)
            BRANCH="sync/sdk-${SHA}"
            git checkout -b "$BRANCH"
            git add .
            git commit -m "chore: sync SDK and schemas from unnamed_tracking_app_plugins@${SHA}"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: sync SDK and schemas from unnamed_tracking_app_plugins@${SHA}" \
              --body "Automated synchronization of public SDK, schemas, and contract versions from companion revision \`${SHA}\`." \
              --base main \
              --head "$BRANCH" || echo "PR creation failed or already exists"
          else
            echo "plugins-template is already up to date."
          fi
