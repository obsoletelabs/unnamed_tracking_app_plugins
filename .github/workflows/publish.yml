name: Publish plugin packages

on:
  push:
    branches: ["**"]
    paths-ignore:
      - 'dist/**'
      - 'releases/**'
      - 'list.json'
  release:
    types: [published]
  workflow_dispatch:

# Serialize publication; an older job must never overwrite a newer catalogue.
concurrency:
  group: plugin-distribution
  cancel-in-progress: false

jobs:
  packages:
    if: github.actor != 'github-actions[bot]' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Main publication always starts from the latest serialized snapshot.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: python tools/check_source_layout.py
      - name: Validate documentation and repository references
        run: python tools/check_docs.py
      - name: Validate developer wiki before publication
        run: python -m mkdocs build --strict
      - run: node --test tests/session_manager_ui.test.mjs tests/native_frontends.test.mjs tests/jellyfin_official_ui.test.mjs
      - run: node --check official/extended-session-manager/frontend/app.js
      - run: pytest
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run check
      - run: npm test
      - name: Reject unexpected test output before signed generation
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            echo "::error::Validation must leave the checkout clean."
            exit 1
          fi
      - name: Build signed immutable releases and generated catalogue
        env:
          PLUGIN_SIGNING_KEY_B64: ${{ secrets.PLUGIN_SIGNING_KEY_B64 }}
          PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
          PLUGIN_EXAMPLES_SIGNING_KEY_ID: ${{ secrets.PLUGIN_EXAMPLES_SIGNING_KEY_ID }}
          PLUGIN_EXAMPLES_SIGNING_KEY_B64: ${{ secrets.PLUGIN_EXAMPLES_SIGNING_KEY_B64 }}
          PLUGIN_OFFICIAL_SIGNING_KEY_ID: ${{ secrets.PLUGIN_OFFICIAL_SIGNING_KEY_ID }}
          PLUGIN_OFFICIAL_SIGNING_KEY_B64: ${{ secrets.PLUGIN_OFFICIAL_SIGNING_KEY_B64 }}
          PLUGIN_SIGNING_FALLBACK: ${{ vars.PLUGIN_SIGNING_FALLBACK || 'generic' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            python tools/build_packages.py --require-signing --reuse-published
          else
            python tools/build_packages.py --require-signing
          fi
      - name: Verify complete distribution and current source
        run: |
          python tools/verify_packages.py dist/*.utp
          python tools/validate_packages.py dist/*.utp
          python tools/distribution.py --check-source
          python tools/distribution.py --baseline-ref HEAD
          pytest
      - name: Commit packages, history, catalogue and resolved source versions on main
        if: github.event_name != 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- dist releases list.json
          git ls-files -z -- 'examples/*/manifest.json' 'official/*/manifest.json' 'plugins/*/manifest.json' | xargs -0 -r git add --
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git ls-files --others --exclude-standard
            echo "::error::Package generation produced output outside the authoritative snapshot."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish plugin packages and release history"
            git push origin HEAD:main
          fi
      - name: Upload packages and metadata to the existing GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            echo "::error::A tagged release must reuse the committed distribution without generated changes."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/*.utp list.json releases/*.json --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: unnamed-tracking-plugins-${{ github.sha }}
          path: |
            dist/*.utp
            list.json
            releases/*.json
          if-no-files-found: error
          retention-days: 7
