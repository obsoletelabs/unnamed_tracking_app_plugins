name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unsigned-dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run check:native
      - run: python -m tools.build_unsigned_previews
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-dist
          path: unsigned-dist/
          if-no-files-found: error
      - name: Require preview builds to leave tracked source unchanged
        run: git diff --exit-code
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: npm ci
      - run: npm run check:native
      - run: python tools/check_source_layout.py
      - name: Validate documentation and repository references
        run: python tools/check_docs.py
      - name: Build developer wiki with strict validation
        run: python -m mkdocs build --strict
      - run: node --test tests/session_manager_ui.test.mjs
      - run: node --test tests/native_frontends.test.mjs
      - run: node --test tests/frontend_appearance.test.mjs
      - run: node --test tests/shortcut_playground.test.mjs
      - run: node --test tests/jellyfin_official_ui.test.mjs
      - run: node --check official/extended-session-manager/frontend/app.js
      - run: pytest
      - run: python tools/build_packages.py
      - run: python tools/verify_packages.py dist/*.utp
      - run: python tools/validate_packages.py dist/*.utp
      - run: python tools/distribution.py
      - name: Preserve published packages and release history
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python tools/distribution.py --baseline-ref "$BASELINE_REF"
      - run: python tools/distribution.py --root .validation --check-source --include-unreleased
      - run: python tools/verify_packages.py .validation/dist/*.utp
      - run: python tools/validate_packages.py .validation/dist/*.utp
      - name: Select companion repository ref
        id: companion
        env:
          REQUESTED_REF: ""
          COMPANION_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref="$REQUESTED_REF"
          if [ -z "$ref" ]; then
            # Current native plugins require the public Plugin API 1.1 host.
            ref=main
            # Repository main branches have different ownership targets.
            if [ "$COMPANION_BRANCH" != main ] && git ls-remote --exit-code --heads https://github.com/obsoletelabs/unnamed_tracking_app_2.git "refs/heads/$COMPANION_BRANCH" >/dev/null; then
              ref="$COMPANION_BRANCH"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing companion repository ref: $ref"
      - uses: actions/checkout@v7
        with:
          repository: obsoletelabs/unnamed_tracking_app_2
          ref: ${{ steps.companion.outputs.ref }}
          path: .validation/host
      - run: python tools/check_host_contract.py --host-root .validation/host
      - name: Select existing mobile PWA source ref
        id: mobile
        env:
          COMPANION_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          mobile_branch="$COMPANION_BRANCH"
          # The appearance migration has a separate canonical mobile-source PR.
          if [ "$COMPANION_BRANCH" = feat/ui-ux-redevelopment ]; then
            mobile_branch=feat/pwa-personal-appearance
          fi
          if [ "$mobile_branch" != main ] && git ls-remote --exit-code --heads https://github.com/obsoletelabs/unnamed-tracking-mobile-app.git "refs/heads/$mobile_branch" >/dev/null; then
            ref="$mobile_branch"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: obsoletelabs/unnamed-tracking-mobile-app
          ref: ${{ steps.mobile.outputs.ref }}
          path: .validation/mobile
      - name: Verify source provenance, version and reviewed host templates
        run: python tools/sync_pwa.py --mobile-root .validation/mobile --host-root .validation/host --check
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Cache Playwright browser downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run check
      - run: npm test
      - name: Reject unexpected generated changes or untracked output
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            echo "::error::Validation must leave the checkout clean; previews belong under .validation."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: validated-plugin-distribution
          path: |
            .validation/dist/*.utp
            .validation/list.json
            .validation/releases/*.json
            .validation/wiki/**
          include-hidden-files: true
          if-no-files-found: error
