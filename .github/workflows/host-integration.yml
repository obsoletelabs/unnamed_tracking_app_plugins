name: Plugin Manager integration

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      host_ref:
        description: "Host ref (defaults to a verified revision; matching branches take precedence)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: plugin_integration
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U test -d plugin_integration"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: plugin_integration
      SECRET_KEY: XJVqc8r7Uj801VzGUYhlQV8A2tZTBepjOYEiP2pTzFk=
      PYTHONPATH: ${{ github.workspace }}/.validation/host/src/backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select companion repository ref
        id: companion
        env:
          REQUESTED_REF: ${{ inputs.host_ref }}
          COMPANION_BRANCH: ${{ github.head_ref || github.ref_name }}
          # Current main plus CI fixes awaiting https://github.com/Rosefall-a/unnamed_tracking_app/pull/432.
          # Return to main after its retained-legacy checker fix is merged.
          DEFAULT_HOST_REF: a2d1c898f4fdfb0270234dad58d73f3eee051568
        run: |
          ref="$REQUESTED_REF"
          if [ -z "$ref" ]; then
            ref="${DEFAULT_HOST_REF:-main}"
            # The v1.1 host is merged; use the verified conformance-tool revision.
            # explicit overrides and matching feature branches remain supported.
            if [ "$COMPANION_BRANCH" != main ] && git ls-remote --exit-code --heads https://github.com/obsoletelabs/unnamed_tracking_app_2.git "refs/heads/$COMPANION_BRANCH" >/dev/null; then
              ref="$COMPANION_BRANCH"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing companion repository ref: $ref"
      - uses: actions/checkout@v7
        with:
          repository: obsoletelabs/unnamed_tracking_app_2
          ref: ${{ steps.companion.outputs.ref }}
          path: .validation/host
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install host and builder dependencies
        run: |
          python -m pip install -r .validation/host/src/backend/requirements.txt jsonschema
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The disposable runner must permit namespaces for strict sandbox tests.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / -- /bin/true
          sudo mkdir -p /data
          sudo chown "$(id -u):$(id -g)" /data
      - name: Prepare disposable database
        working-directory: .validation/host/src/backend
        run: alembic upgrade head
      - name: Build the actual Plugin Manager frontend
        working-directory: .validation/host/src/frontend
        run: |
          npm ci
          npm run build
      - name: Install browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
      - name: Verify official distribution and real-worker lifecycle
        env:
          JELLYFIN_SCREENSHOT_DIR: ${{ runner.temp }}/plugin-acceptance/screenshots
        run: |
          python tools/check_host_lifecycle.py --host-root .validation/host \
            --plugins-root . \
            --work-root "${{ runner.temp }}/plugin-acceptance" --browser
      - name: Exercise real reference packages through runtime transactions
        env:
          # Matches the existing process-mode acceptance above. The actual
          # supervisor still probes and reports isolation; nothing is mocked.
          NONBUBBLE_ENV: 'true'
        run: python tools/check_reference_lifecycle.py --host-root .validation/host
      - name: Verify actual legacy worker withdrawal and signed v1.1 upgrade
        env:
          NONBUBBLE_ENV: 'true'
        run: |
          python .validation/host/tools/check_plugin_contract_upgrade.py --plugins-root . \
            --work-root "${{ runner.temp }}/contract-upgrade-acceptance"
      - name: Test independently installed official Jellyfin preview
        run: |
          bash .validation/host/tools/run_strict_plugin_acceptance.sh \
            "$GITHUB_WORKSPACE/.validation/host" "$GITHUB_WORKSPACE" \
            "${{ runner.temp }}/jellyfin-official-acceptance"
      - name: Verify official PWA signing and real browser lifecycle
        run: |
          python .validation/host/tools/check_pwa_lifecycle.py --plugins-root . \
            --work-root "${{ runner.temp }}/pwa-acceptance"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-manager-integration-evidence
          path: |
            ${{ runner.temp }}/plugin-acceptance/*.log
            ${{ runner.temp }}/plugin-acceptance/conformance.json
            ${{ runner.temp }}/plugin-acceptance/**/*.png
            ${{ runner.temp }}/plugin-acceptance/workflow-captures.json
            ${{ runner.temp }}/jellyfin-official-acceptance/*.log
            ${{ runner.temp }}/jellyfin-official-acceptance/conformance.json
            ${{ runner.temp }}/jellyfin-official-acceptance/screenshots/*.png
            ${{ runner.temp }}/pwa-acceptance/*.log
            ${{ runner.temp }}/pwa-acceptance/*.png
            ${{ runner.temp }}/pwa-acceptance/pwa-conformance.json
            ${{ runner.temp }}/contract-upgrade-acceptance/conformance.json
          if-no-files-found: warn
