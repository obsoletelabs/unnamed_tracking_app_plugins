[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utp-integration-reference-client"
version = "1.0.0"
description = "Platform-neutral reference consumer for Unnamed Tracking App scoped integration access (delegation v1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
utp-integration-client = "utp_integration_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
